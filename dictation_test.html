        // 主测试顺序 = 原始顺序；即时后测使用固定的替代顺序（同一批单词、音频和句子，只改变出现顺序）
        const QUESTIONS = QUESTIONS_BASE;
        const POST_ORDER = [38, 30, 49, 4, 20, 14, 47, 35, 15, 5, 36, 17, 16, 41, 40, 46, 7, 0, 31, 42, 34, 32, 25, 12, 45, 11, 22, 3, 1, 9, 2, 48, 10, 21, 23, 29, 44, 19, 39, 43, 27, 6, 26, 8, 13, 18, 24, 33, 37, 28];

        // 只接受指定的形式：8 个空格允许过去式/原型或单数/复数，其余只接受原词
        function getAllWordForms(word) {
            const q = QUESTIONS.find(x => x.word === word);
            return q && q.accept ? q.accept : [word];
        }

        // 字符级对齐比较（LCS 对齐，缺字母留空，之后的字母重新对齐）
        function compareWordsCharByChar(correctWord, inputWord) {
            const c = correctWord.toLowerCase();
            const t = inputWord.toLowerCase();
            const n = c.length, m = t.length;
            // dp[i][j] = c[i..] 与 t[j..] 的最长公共子序列长度
            const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
            for (let i = n - 1; i >= 0; i--) {
                for (let j = m - 1; j >= 0; j--) {
                    dp[i][j] = c[i] === t[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
                }
            }
            const result = [];
            let i = 0, j = 0;
            while (i < n || j < m) {
                if (i < n && j < m && c[i] === t[j]) {
                    result.push({ correct: correctWord[i], input: inputWord[j], match: true });
                    i++; j++;
                } else if (i < n && (j >= m || dp[i + 1][j] >= dp[i][j + 1])) {
                    // 正确拼写中的字母在输入中缺失
                    result.push({ correct: correctWord[i], input: ' ', match: false, missing: true });
                    i++;
                } else {
                    // 输入中多出的字母
                    result.push({ correct: '', input: inputWord[j], match: false, extra: true });
                    j++;
                }
            }
            // 相邻的"缺字母 + 多字母"合并为一个替换位置（如 e→a）
            const merged = [];
            for (let k = 0; k < result.length; k++) {
                const cur = result[k], nxt = result[k + 1];
                if (cur.missing && nxt && nxt.extra) {
                    merged.push({ correct: cur.correct, input: nxt.input, match: false });
                    k++;
                } else if (cur.extra && nxt && nxt.missing) {
                    merged.push({ correct: nxt.correct, input: cur.input, match: false });
                    k++;
                } else {
                    merged.push(cur);
                }
            }
            return merged;
        }

        // 点击某一列后，用该列的正确字母替换，其余列保持不变
        function buildInputFromColumns(columns, clickedIdx) {
            let s = '';
            columns.forEach((col, k) => {
                if (k === clickedIdx) s += col.correct;
                else if (!col.missing) s += col.input;
            });
            return s;
        }

        // 差异高亮：最少修改次数对齐（替换/删除/插入各算 1 次，平局时优先替换）
        function buildDiffOps(correctWord, inputWord) {
            const c = correctWord.toLowerCase();
            const t = inputWord.toLowerCase();
            const n = t.length, m = c.length;
            const d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
            for (let i = 0; i <= n; i++) d[i][0] = i;
            for (let j = 0; j <= m; j++) d[0][j] = j;
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const cost = t[i - 1] === c[j - 1] ? 0 : 1;
                    d[i][j] = Math.min(d[i - 1][j - 1] + cost, d[i - 1][j] + 1, d[i][j - 1] + 1);
                }
            }
            const ops = [];
            let i = n, j = m;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (t[i - 1] === c[j - 1] ? 0 : 1)) {
                    ops.unshift({ typed: inputWord[i - 1], correct: correctWord[j - 1], bad: t[i - 1] !== c[j - 1] });
                    i--; j--;
                } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) {
                    ops.unshift({ typed: inputWord[i - 1], correct: '', bad: true });   // 输入多出的字母
                    i--;
                } else {
                    ops.unshift({ typed: '_', correct: correctWord[j - 1], bad: true }); // 输入缺少的字母
                    j--;
                }
            }
            return ops;
        }

                return () => clearTimeout(timer);
            }, [currentIndex, stage]);

            const handleStart = () => {
                const id = pidInput.trim();
                if (!id) return;
                prolificId.current = id;
                startedAt.current = Date.now();
                setStage('task');
            };

            // 上传全部成功后自动跳转问卷（未成功前不跳转，避免数据丢失）
            useEffect(() => {
                if (stage === 'saving' && summary && uploadState.pending === 0) {
                    const timer = setTimeout(() => {
                        window.location.href = PROLIFIC_COMPLETION_URL;
                    }, 1500);
                    return () => clearTimeout(timer);
                }
            }, [stage, summary, uploadState.pending]);

            // ---------- 问卷 ----------
            const normOpt = o => (typeof o === 'string' ? { value: o, label: o } : o);
            const otherOf = q => (q.options || []).map(normOpt).find(o => o.other);
            const isAnsweredQ = (q, a) => {
                if (q.optional) return true;
                if (q.showIf && !q.showIf(a)) return true;
                const v = a[q.id];
                if (q.type === 'text') return !!(v && v.trim());
                if (q.type === 'constant') {
                    return Array.isArray(v) && v.length === q.items.length && v.every(x => x !== '' && x !== undefined)
                        && v.reduce((s, x) => s + Number(x), 0) === 100;
                }
                const oth = otherOf(q);
                const needsOther = !!(oth && (q.type === 'multi' ? (Array.isArray(v) && v.includes(oth.value)) : v === oth.value));
                if (q.type === 'multi') {
                    if (!Array.isArray(v) || v.length === 0) return false;
                } else if (!v) {
                    return false;
                }
                return !(needsOther && !((a[q.id + '_other'] || '').trim()));
            };
            const toggleMulti = (q, value) => {
                setAnswers(prev => {
                    const cur = Array.isArray(prev[q.id]) ? prev[q.id] : [];
                    let next;
                    if (cur.includes(value)) next = cur.filter(v => v !== value);
                    else if (value === q.exclusive) next = [value];
                    else next = [...cur.filter(v => v !== q.exclusive), value];
                    return { ...prev, [q.id]: next };
                });
            };
            const renderInput = q => {
                if (q.type === 'text') {
                    return (
                        <textarea
                            value={answers[q.id] || ''}
                            onChange={e => setAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}
                            style={{ width: '100%', minHeight: '80px', padding: '8px', fontSize: '16px', boxSizing: 'border-box' }}
                        />
                    );
                }
                if (q.type === 'constant') {
                    const vals = Array.isArray(answers[q.id]) ? answers[q.id] : q.items.map(() => '');
                    const total = vals.reduce((s, x) => s + (Number(x) || 0), 0);
                    return (
                        <div>
                            {q.items.map((item, i) => (
                                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '6px 0', fontSize: '16px' }}>
                                    <input
                                        type="number" min="0" max="100" value={vals[i]}
                                        onChange={e => { const nv = [...vals]; nv[i] = e.target.value; setAnswers(prev => ({ ...prev, [q.id]: nv })); }}
                                        style={{ width: '90px', fontSize: '16px', padding: '6px' }}
                                    />
                                    <span>%&nbsp;&nbsp;{item}</span>
                                </div>
                            ))}
                            <div style={{ fontSize: '15px', marginTop: '6px', color: total === 100 ? '#2e7d32' : '#d32f2f' }}>
                                Total: {total} / 100
                            </div>
                        </div>
                    );
                }
                const selected = q.type === 'multi' ? (Array.isArray(answers[q.id]) ? answers[q.id] : []) : null;
                const isOn = o => (selected ? selected.includes(o.value) : answers[q.id] === o.value);
                return (
                    <div>
                        {(q.options || []).map(normOpt).map(o => (
                            <label key={o.value} style={{ display: 'block', padding: '5px 0', cursor: 'pointer', fontSize: '16px' }}>
                                {q.type === 'multi'
                                    ? <input type="checkbox" checked={isOn(o)} onChange={() => toggleMulti(q, o.value)} style={{ marginRight: '8px' }} />
                                    : <input type="radio" name={q.id} value={o.value} checked={isOn(o)}
                                        onChange={() => setAnswers(prev => ({ ...prev, [q.id]: o.value }))} style={{ marginRight: '8px' }} />}
                                {o.label}
                                {o.other && isOn(o) && (
                                    <input
                                        type="text"
                                        value={answers[q.id + '_other'] || ''}
                                        onChange={e => setAnswers(prev => ({ ...prev, [q.id + '_other']: e.target.value }))}
                                        style={{ marginLeft: '8px', fontSize: '16px', padding: '4px' }}
                                    />
                                )}
                                {o.img && (
                                    <div style={{ marginTop: '6px' }}>
                                        <img src={o.img} alt={o.label} style={{ maxWidth: '100%', border: '1px solid #ddd', borderRadius: '6px' }} />
                                    </div>
                                )}
                            </label>
                        ))}
                    </div>
                );
            };
            const renderQuestionnaire = (list, title, intro, onSubmit) => {
                const visible = list.filter(q => !q.showIf || q.showIf(answers));
                const allDone = list.every(q => isAnsweredQ(q, answers));
                return (
                    <div className="container">
                        <div className="banner">🌐 Online Experiment</div>
                        <div className="card">
                            <h2 style={{ marginBottom: '0.5rem' }}>{title}</h2>
                            <p style={{ fontSize: '16px', color: '#666', marginBottom: '1.5rem', lineHeight: 1.6 }}>{intro}</p>
                            {visible.map((q, idx) => (
                                <div key={q.id} style={{ marginBottom: '1.5rem' }}>
                                    <div style={{ fontWeight: 600, marginBottom: '0.5rem', fontSize: '17px' }}>
                                        {idx + 1}. {q.text}{q.optional ? ' (optional)' : ''}
                                    </div>
                                    {renderInput(q)}
                                </div>
                            ))}
                            <button className="button-primary" onClick={onSubmit} disabled={!allDone} style={{ width: '100%', marginTop: '1rem' }}>
                                Submit and continue
                            </button>
                        </div>
                    </div>
                );
            };
            const submitQuestionnaire = part => {
                const list = part === 'A' ? QUESTIONNAIRE_A : QUESTIONNAIRE_B;
                const clean = {};
                list.forEach(q => {
                    if (q.showIf && !q.showIf(answers)) return;   // 隐藏的题目不记录
                    if (answers[q.id] !== undefined) clean[q.id] = answers[q.id];
                    if (answers[q.id + '_other'] !== undefined) clean[q.id + '_other'] = answers[q.id + '_other'];
                });
                enqueueUpload({
                    type: 'questionnaire',
                    part: part,
                    group: 'test',
                    prolificId: prolificId.current,
                    studyId: studyInfo.current.studyId,
                    sessionId: studyInfo.current.sessionId,
                    completedAt: Date.now(),
                    answers: clean,
                });
                setStage(part === 'A' ? 'transition' : 'saving');
            };

            // ---------- 上传（每题一条 + 完成后一条汇总；失败保留在队列中重试）----------
            const refreshUploadState = () => {
                setUploadState({
                    pending: uploadQueue.current.length,
                    sending: uploadQueue.current.filter(item => item.sending).length,
                });
            };

            const flushUploadQueue = () => {
                if (db) {
                    uploadQueue.current.forEach(item => {
                        if (item.sending) return;
                        item.sending = true;
                        const timeout = new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('timeout')), 15000));
                        Promise.race([db.collection('experiments').add(item.data), timeout])
                            .then(() => {
                                uploadQueue.current = uploadQueue.current.filter(x => x !== item);
                            })
                            .catch(err => {
                                item.sending = false;
                                console.error('Upload failed, will retry:', err);
                            })
                            .finally(refreshUploadState);
                    });
                }
                refreshUploadState();
            };

            const enqueueUpload = (data) => {
                uploadQueue.current.push({ data: data, sending: false });
                flushUploadQueue();
            };

            useEffect(() => {
                window.addEventListener('online', flushUploadQueue);
                return () => window.removeEventListener('online', flushUploadQueue);
            }, []);

            // ---------- 构建单题记录 ----------
            const diffMs = (from, to) => (from !== null && to !== null ? to - from : null);

            const buildQuestionRecord = (log, nextAt) => {
                const subs = log.submissions;
                const firstSub = subs[0];
                const firstSubmitAt = firstSub.t;
                const replaceAt = log.replace ? log.replace.t : null;
                const correctAtNext = !!log.replace || subs[subs.length - 1].correct;

                return {
                    type: 'question',
                    group: 'test',
                    prolificId: prolificId.current,
                    studyId: studyInfo.current.studyId,
                    sessionId: studyInfo.current.sessionId,
                    qNumber: log.qNumber,
                    targetWord: log.targetWord,
                    shownAt: log.shownAt,
                    nextAt: nextAt,
                    submissionCount: subs.length,
                    firstSubmitCorrect: firstSub.correct,
                    correctAtNext: correctAtNext,
                    replaceClicked: !!log.replace,
                    replace: log.replace,
                    submissions: subs,
                    events: log.events,
                    timing: {
                        firstSubmitLatencyMs: diffMs(log.shownAt, firstSubmitAt),
                        firstSubmitToNextMs: diffMs(firstSubmitAt, nextAt),
                        replaceToNextMs: diffMs(replaceAt, nextAt),
                        retryIntervalsMs: subs.slice(1).map((s, i) => s.t - subs[i].t),
                    },
                };
            };

            // 即时后测 / 延迟测试：没有反馈；可以返回上一题修改；每次离开一题（Enter 或返回）都上传一次记录
            const saveVisit = (leaveAction) => {
                const log = qlog.current;
                if (!log) return;
                const leftAt = Date.now();
                if (leaveAction === 'back') {
                    log.events.push({ t: leftAt, type: 'back', before: userInput });
                } else {
                    log.events.push({ t: leftAt, type: 'next', finalAnswer: userInput });
                }
                const prev = postAnswers.current[currentIndex] || { visits: 0, submissionCount: 0, firstCorrect: null, finalInput: '', finalCorrect: false };
                prev.visits += 1;
                prev.submissionCount += log.submissions.length;
                if (log.submissions.length) {
                    if (prev.firstCorrect === null) prev.firstCorrect = log.submissions[0].correct;
                    const last = log.submissions[log.submissions.length - 1];
                    prev.finalInput = last.input;
                    prev.finalCorrect = last.correct;
                }
                postAnswers.current[currentIndex] = prev;
                enqueueUpload({
                    type: 'posttest',
                    group: 'test',
                    prolificId: prolificId.current,
                    studyId: studyInfo.current.studyId,
                    sessionId: studyInfo.current.sessionId,
                    qNumber: log.qNumber,
                    targetWord: log.targetWord,
                    visit: prev.visits,
                    leaveAction: leaveAction,
                    submissions: log.submissions,
                    events: log.events,
                });
                qlog.current = null;
            };

            const goBackPosttest = () => {
                if (stage !== 'posttest' || currentIndex === 0) return;
                saveVisit('back');
                const target = currentIndex - 1;
                const prevAnswer = postAnswers.current[target];
                pendingReturn.current = { t: Date.now(), type: 'return', restored: prevAnswer ? prevAnswer.finalInput : '' };
                setCurrentIndex(target);
                setUserInput(prevAnswer ? prevAnswer.finalInput : '');
                setFeedback(null);
            };

            const advancePosttest = () => {
                const nextAt = Date.now();
                saveVisit('next');
                if (currentIndex === QUESTIONS.length - 1) {
                    const answers = postAnswers.current.filter(Boolean);
                    const correctCount = answers.filter(a => a.finalCorrect).length;
                    const finalPost = {
                        type: 'posttest_summary',
                        group: 'test',
                        prolificId: prolificId.current,
                        studyId: studyInfo.current.studyId,
                        sessionId: studyInfo.current.sessionId,
                        startedAt: postStartedAt.current,
                        completedAt: nextAt,
                        totalDurationMs: nextAt - postStartedAt.current,
                        totalQuestions: QUESTIONS.length,
                        correctAnswers: correctCount,
                        firstTryCorrect: answers.filter(a => a.firstCorrect === true).length,
                        revisedCount: answers.filter(a => a.submissionCount > 1).length,
                        accuracy: Math.round((correctCount / QUESTIONS.length) * 100),
                        userAgent: navigator.userAgent,
                    };
                    enqueueUpload(finalPost);
                    setStage('transitionB');
                } else {
                    const nextIdx = currentIndex + 1;
                    const nextAnswer = postAnswers.current[nextIdx];
                    setCurrentIndex(nextIdx);
                    setUserInput(nextAnswer ? nextAnswer.finalInput : '');
                }
            };

            // ---------- 交互 ----------
            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    if (feedback && feedback.type === 'correct') {
                        handleNext();
                    } else if (userInput.trim()) {
                        handleSubmit();
                    }
                }
            };

            const handleSubmit = () => {
                if (userInput.trim() === '') return;

                const now = Date.now();
                const acceptableForms = getAllWordForms(currentQuestion.word);
                const isCorrect = acceptableForms.some(form => form.toLowerCase() === userInput.toLowerCase());

                if (qlog.current) {
                    qlog.current.submissions.push({ t: now, input: userInput, correct: isCorrect });
                    qlog.current.events.push({
                        t: now, type: 'enter', before: userInput, after: userInput, correct: isCorrect,
                    });
                }

                if (stage === 'posttest') {
                    advancePosttest();
                    return;
                }

                if (isCorrect) {
                    setFeedback({ type: 'correct' });
                    setStats(prev => ({ correct: prev.correct + 1, total: prev.total + 1 }));
                } else {
                    const comparison = compareWordsCharByChar(currentQuestion.word, userInput);
                    setFeedback({ type: 'spelling_error', ops: buildDiffOps(currentQuestion.word, userInput) });
                    setStats(prev => ({ ...prev, total: prev.total + 1 }));
                }
            };

            // 一键替换：点击后输入框替换为正确拼写，并按正确处理（计为正确）
            const handleReplaceWithCorrect = () => {
                if (qlog.current) {
                    const now = Date.now();
                    qlog.current.replace = { t: now, typedBefore: userInput, after: currentQuestion.word };
                    qlog.current.events.push({ t: now, type: 'replace', before: userInput, after: currentQuestion.word });
                }
                setUserInput(currentQuestion.word);
                setFeedback({ type: 'correct', replaced: true });
                setStats(prev => ({ ...prev, correct: prev.correct + 1 }));
                // 替换后把焦点还给输入框，否则按 Enter 无法进入下一题
                setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
            };

            const handleNext = () => {
                if (!feedback || feedback.type !== 'correct' || !qlog.current) return;

                const nextAt = Date.now();
                qlog.current.events.push({ t: nextAt, type: 'next', finalAnswer: userInput });
                const record = buildQuestionRecord(qlog.current, nextAt);
                qlog.current = null;
                records.current.push(record);
                enqueueUpload(record);

                if (currentIndex === QUESTIONS.length - 1) {
                    const correctCount = records.current.filter(r => r.correctAtNext).length;
                    const finalSummary = {
                        group: 'test',
                        prolificId: prolificId.current,
                        studyId: studyInfo.current.studyId,
                        sessionId: studyInfo.current.sessionId,
                        startedAt: startedAt.current,
                        completedAt: nextAt,
                        totalDurationMs: nextAt - startedAt.current,
                        totalQuestions: QUESTIONS.length,
                        correctAnswers: correctCount,
                        firstTryCorrect: records.current.filter(r => r.firstSubmitCorrect).length,
                        replaceCount: records.current.filter(r => r.replaceClicked).length,
                        accuracy: Math.round((correctCount / QUESTIONS.length) * 100),
                        userAgent: navigator.userAgent,
                    };
                    enqueueUpload({ type: 'summary', ...finalSummary });
                    setSummary(finalSummary);
                    setCurrentIndex(0);
                    setUserInput('');
                    setFeedback(null);
                    setStage('questionnaireA');
                } else {
                    setCurrentIndex(currentIndex + 1);
                    setUserInput('');
                    setFeedback(null);
                }
            };

            const handlePlayAudio = () => {
                if (qlog.current) {
                    qlog.current.events.push({ t: Date.now(), type: 'audio' });
                }
                setIsPlaying(true);
                const audioUrl = `https://raw.githubusercontent.com/weismiling/audio-listening-experiment/main/audio/${currentQuestion.word}.mp3`;
                const audio = new Audio(audioUrl);
                audio.playbackRate = 0.9;
                audio.onended = () => setIsPlaying(false);
                audio.onerror = () => setIsPlaying(false);
                const playPromise = audio.play();
                if (playPromise && playPromise.catch) {
                    // 浏览器阻止了自动播放（第一题尚未有用户点击）：恢复按钮，让参与者手动点击播放
                    playPromise.catch(() => setIsPlaying(false));
                }
            };

            const downloadJSON = () => {
                const data = { summary: summary, questions: records.current };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `result_${prolificId.current}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            // ========== 完成页面 ==========
            const renderUploadStatus = () => {
                if (uploadState.pending === 0) {
                    return (
                        <div className="upload-status upload-success">
                            ✓ Saved. Redirecting to Prolific...
                        </div>
                    );
                }
                const sending = uploadState.sending > 0;
                return (
                    <div className={`upload-status ${sending ? 'upload-uploading' : 'upload-error'}`}>
                        {sending
                            ? 'Uploading results... please keep this page open.'
                            : `${uploadState.pending} record(s) not uploaded yet. Please check your connection and retry.`}
                        <div style={{ marginTop: '0.75rem' }}>
                            <button className="button-primary" onClick={flushUploadQueue} style={{ width: 'auto', padding: '0.5rem 1rem', fontSize: '14px' }}>
                                🔁 Retry upload
                            </button>
                        </div>
                    </div>
                );
            };

            // ========== 说明页 + Prolific ID 输入 ==========
            if (stage === 'intro') {
                return (
                    <div className="container">
                        <div className="test-banner">🧪 TEST MODE</div>
                        <div className="card">
                            <h2 style={{ marginBottom: '1.25rem' }}>Welcome to the Audio Listening Experiment</h2>

                            <p style={{ fontSize: '19px', lineHeight: 1.6, marginBottom: '0.75rem' }}><b>Time:</b> about 40 minutes</p>
                            <p style={{ fontSize: '19px', lineHeight: 1.6, marginBottom: '0.75rem' }}>Please use <b>a desktop computer, with headphones,</b> in a quiet place.</p>

                                                        <p style={{ fontSize: '19px', lineHeight: 1.6, marginBottom: '0.75rem' }}>You will hear a word and type it into a sentence. The audio plays automatically when each question appears. If it does not play, click "Play Audio". You can replay it as many times as you like.</p>
                            <ul style={{ paddingLeft: '1.25rem', lineHeight: 1.8, fontSize: '19px', marginBottom: '1.25rem' }}>
                                <li>Part 1 (50 questions): <b><u>you get feedback after each answer.</u></b> If your answer is wrong, you can click "Replace with correct spelling" to fill in the correct word, or type the correct spelling again.</li>
                                <li>Part 2 (50 questions): <b><u>no feedback.</u></b></li>
                                <li>There is a short questionnaire after Part 1, and another short questionnaire after Part 2.</li>
                            </ul>

<h3 style={{ fontSize: '21px', marginBottom: '0.5rem' }}>Notes:</h3>
                            <ul style={{ paddingLeft: '1.25rem', lineHeight: 1.8, fontSize: '19px', marginBottom: '1.25rem' }}>
                                <li>Keep a stable internet connection.</li>
                                <li><b><u>Do not refresh the page.</u></b> Complete the study in one session.</li>
                                <li>While answering, do not use a spell checker, reference materials, or look up words online.</li>
                                <li><b><u>Your answers and the timing of your typing and clicks are recorded for research only.</u></b></li>
                                <li><b><u>You may be invited to a short follow-up test about 2 weeks later.</u></b></li>
                            </ul>

                            <h3 style={{ fontSize: '21px', marginBottom: '0.5rem' }}>🆔 Please enter your Prolific ID:</h3>
                            <p style={{ fontSize: '17px', color: '#666', marginBottom: '0.75rem' }}>
                                This ID is provided by Prolific and is required to receive payment.
                            </p>
                            <input
                                type="text"
                                value={pidInput}
                                onChange={(e) => setPidInput(e.target.value)}
                                placeholder="Prolific ID"
                                style={{ width: '100%', padding: '10px', fontSize: '18px', marginBottom: '1.5rem', boxSizing: 'border-box' }}
                            />
                            <button
                                className="button-primary"
                                onClick={handleStart}
                                disabled={!pidInput.trim()}
                                style={{ width: '100%' }}
                            >
                                Start Experiment
                            </button>
                        </div>
                    </div>
                );
            }

            // ========== 问卷 A（主测试结束后，即时后测之前） ==========
            if (stage === 'questionnaireA') {
                return renderQuestionnaire(QUESTIONNAIRE_A, 'Questionnaire (1 of 2)',
                    'Please answer these questions about the first part of the test. Questions marked "optional" can be left blank.',
                    () => submitQuestionnaire('A'));
            }

            // ========== 过渡页：即时后测结束 → 问卷 B ==========
            if (stage === 'transitionB') {
                return (
                    <div className="container">
                        <div className="banner">🌐 Online Experiment</div>
                        <div className="card">
                            <div className="completion-screen">
                                <h2>Next: a few short questions</h2>
                                <p style={{ fontSize: '18px', color: '#666', marginTop: '0.75rem', lineHeight: 1.6 }}>
                                    The test is finished. Please answer a few short questions about your experience. Click Continue when you are ready.
                                </p>
                                <button
                                    className="button-primary"
                                    onClick={() => setStage('questionnaireB')}
                                    style={{ marginTop: '1.5rem', background: '#1976d2' }}
                                >
                                    Continue
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== 问卷 B（即时后测之后） ==========
            if (stage === 'questionnaireB') {
                return renderQuestionnaire(QUESTIONNAIRE_B, 'Questionnaire (2 of 2)',
                    'Please answer these questions about the second part and the whole study. Questions marked "optional" can be left blank.',
                    () => submitQuestionnaire('B'));
            }

            // ========== 保存中 → 自动跳转 Prolific ==========
            if (stage === 'saving' && summary) {
                const failed = uploadState.pending > 0 && uploadState.sending === 0;
                return (
                    <div className="container">
                        <div className="test-banner">🧪 TEST MODE</div>
                        <div className="card">
                            <div className="completion-screen">
                                <h2>Saving your responses...</h2>
                                <p style={{ fontSize: '16px', color: '#666', marginTop: '0.75rem' }}>
                                    Please keep this page open until the save is complete.
                                </p>
                                {renderUploadStatus()}
                                {failed && (
                                    <button
                                        className="button-primary"
                                        onClick={downloadJSON}
                                        style={{ marginTop: '0.75rem', background: '#1976d2' }}
                                    >
                                        💾 Download backup (JSON)
                                    </button>
                                )}
                                <p style={{ marginTop: '2rem', fontSize: '11px', color: '#666' }}>
                                    Participant ID: {prolificId.current}
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== 转换页：有反馈的测试结束 → 无反馈的听力测试 ==========
            if (stage === 'transition') {
                return (
                    <div className="container">
                        <div className="test-banner">🧪 TEST MODE</div>
                        <div className="card">
                            <div className="completion-screen">
                                <h2>Next: Listening Test (50 questions)</h2>
                                <p style={{ fontSize: '16px', color: '#666', marginTop: '0.75rem', lineHeight: 1.6 }}>
                                    The next part has 50 more spelling questions. There is <b>no feedback</b> in this part.
                                    You may go back to the previous question with the Back button to correct an answer. Press Enter to save each answer and move on.
                                </p>
                                <button
                                    className="button-primary"
                                    onClick={() => { postStartedAt.current = Date.now(); setStage('posttest'); }}
                                    style={{ marginTop: '1.5rem', background: '#1976d2' }}
                                >
                                    Start
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== 答题页面 ==========
            return (
                <div className="container">
                    {stage === 'posttest' ? <div className="test-banner">📝 POST-TEST - 50 Questions (no feedback)</div> : <div className="test-banner">🧪 TEST MODE - 50 Questions (Local Testing)</div>}

                    <div className="progress-bar">
                        <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                    </div>

                    <div className="card">
                        <div className="question-number">{stage === 'posttest' ? 'Post-test · ' : ''}Question {currentIndex + 1} of {QUESTIONS.length}</div>

                        <div className="audio-controls">
                            <button 
                                className="button-primary" 
                                onClick={handlePlayAudio}
                                disabled={isPlaying}
                            >
                                {isPlaying ? '🔊 Playing...' : '🔊 Play Audio'}
                            </button>
                        </div>

                        <div className="sentence">
                            {currentQuestion.sentence.split('________')[0]}
                            <input
                                ref={inputRef}
                                type="text"
                                spellCheck={false}
                                autoComplete="off"
                                autoCorrect="off"
                                autoCapitalize="off"
                                value={userInput}
                                onChange={(e) => {
                                    setUserInput(e.target.value);
                                    if (qlog.current) {
                                        qlog.current.events.push({ t: Date.now(), type: 'input', value: e.target.value });
                                    }
                                }}
                                onKeyPress={handleKeyPress}
                                className="inline-input"
                                placeholder="type here"
                            />
                            {currentQuestion.sentence.split('________')[1]}
                        </div>

                        {feedback && feedback.type === 'correct' && !feedback.replaced && (
                            <div className="status-success">✓ Correct!</div>
                        )}

                        {feedback && feedback.type === 'spelling_error' && (
                            <div className="feedback-section">
                                <div className="diff-label">Your spelling:</div>
                                <div className="diff-row">
                                    {feedback.ops.map((op, idx) => (
                                        <React.Fragment key={idx}>
                                            <span className={`diff-cell ${op.bad ? 'diff-bad' : ''}`}>{op.typed}</span>
                                            {idx < feedback.ops.length - 1 && <span className="diff-sep">|</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <div className="diff-label">Correct spelling:</div>
                                <div className="diff-row">
                                    {feedback.ops.map((op, idx) => (
                                        <React.Fragment key={idx}>
                                            <span className="diff-cell">{op.correct}</span>
                                            {idx < feedback.ops.length - 1 && <span className="diff-sep">|</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <button
                                    className="button-primary replace-btn"
                                    onClick={handleReplaceWithCorrect}
                                    style={{ background: '#1976d2' }}
                                >
                                    🔁 Replace with correct spelling
                                </button>
                            </div>
                        )}

                        {feedback && (
                            <button 
                                className="button-primary" 
                                onClick={handleNext}
                                style={{ marginTop: '2rem', width: '100%' }}
                            >
                                {currentIndex === QUESTIONS.length - 1 ? 'Finish Test →' : 'Next Question →'}
                            </button>
                        )}
                        {stage === 'posttest' && (
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '1rem', marginTop: '1.5rem' }}>
                                <button
                                    className="button-primary"
                                    onClick={goBackPosttest}
                                    disabled={currentIndex === 0}
                                    style={{ flex: 1, background: '#777', opacity: currentIndex === 0 ? 0.4 : 1 }}
                                >
                                    ← Previous question
                                </button>
                                <button
                                    className="button-primary"
                                    onClick={() => { if (userInput.trim()) handleSubmit(); }}
                                    disabled={!userInput.trim()}
                                    style={{ flex: 1, opacity: userInput.trim() ? 1 : 0.4 }}
                                >
                                    {currentIndex === QUESTIONS.length - 1 ? 'Finish →' : 'Next question →'}
                                </button>
                            </div>
                        )}
                    </div>

                    <div style={{ textAlign: 'center', fontSize: '14px', color: '#666', marginTop: '1rem' }}>
                        {stage === 'task' ? `${stats.correct} / ${Math.max(stats.total, 1)} correct` : ''}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<DictationTest />, document.getElementById('root'));
    </script>
</body>
</html>
