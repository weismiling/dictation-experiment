<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Listening Experiment</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-size: 18px; }
    .box { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); max-width: 480px; text-align: center; }
</style>
</head>
<body>
<div class="box"><p id="msg">Loading...</p></div>

<script>
    // Firebase 配置（与实验页面相同）
    const firebaseConfig = {
        apiKey: "AIzaSyABPS87c_8CnEfsMiuWfWmSFl0wrOIwBuo",
        authDomain: "dictation-experiment.firebaseapp.com",
        projectId: "dictation-experiment",
        storageBucket: "dictation-experiment.firebasestorage.app",
        messagingSenderId: "133046248660",
        appId: "1:133046248660:web:7af799b88fed0b4f0f0741"
    };

    // 两组对应的实验页面（以后换版本时只改这里）
    const TARGET = {
        control: 'dictation_control.html',
        test: 'dictation_test.html'
    };
    const TIMEOUT_MS = 8000;   // 分配超过这个时间就改用随机分配，避免参与者一直等待

    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch (e) {
        console.error('Firebase init failed:', e);
    }

    const $ = id => document.getElementById(id);
    const setMsg = text => { $('msg').textContent = text; };

    const coinFlip = () => (Math.random() < 0.5 ? 'control' : 'test');

    const withTimeout = (promise, ms) => Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);

    // 平衡分配：在事务里读取两组人数，分给人数较少的一组，并把该组计数 +1
    // 人数相同时随机分配
    async function balancedAssign() {
        const ref = db.collection('assignment').doc('counts');
        return db.runTransaction(async tx => {
            const snap = await tx.get(ref);
            const data = snap.exists ? snap.data() : { control: 0, test: 0 };
            let group;
            if (data.control < data.test) group = 'control';
            else if (data.test < data.control) group = 'test';
            else group = coinFlip();
            tx.set(ref, {
                control: data.control + (group === 'control' ? 1 : 0),
                test: data.test + (group === 'test' ? 1 : 0)
            });
            return group;
        });
    }

    // 同一个 Prolific ID 只分配一次：之后刷新或重新打开，都沿用同一组
    async function assignGroup(pid) {
        const key = 'assignment_' + pid;
        let saved = null;
        try { saved = localStorage.getItem(key); } catch (e) { /* 隐私模式等情况忽略 */ }
        if (saved && TARGET[saved]) return { group: saved, method: 'saved' };

        let group, method;
        try {
            if (!db) throw new Error('Firestore not available');
            group = await withTimeout(balancedAssign(), TIMEOUT_MS);
            method = 'balanced';
        } catch (e) {
            console.warn('Balanced assignment failed, using random:', e);
            group = coinFlip();
            method = 'random-fallback';
        }

        try { localStorage.setItem(key, group); } catch (e) { /* 忽略 */ }

        // 记录分配结果（失败不影响实验）
        if (db) {
            db.collection('assignments').add({
                prolificId: pid,
                group: group,
                method: method,
                assignedAt: Date.now(),
                userAgent: navigator.userAgent
            }).catch(err => console.warn('Assignment log failed:', err));
        }
        return { group, method };
    }

    async function main() {
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('PROLIFIC_PID') || params.get('pid');
        if (!pid) {
            setMsg('Please open this study from the Prolific link.');
            return;
        }
        setMsg('Preparing the experiment...');
        const { group } = await assignGroup(pid);
        // 保留 Prolific 传来的全部参数（PROLIFIC_PID、STUDY_ID、SESSION_ID）
        window.location.replace(TARGET[group] + window.location.search);
    }

    window.assignGroup = assignGroup;   // 方便测试
    main();
</script>
</body>
</html>
